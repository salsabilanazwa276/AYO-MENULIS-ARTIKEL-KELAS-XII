<!doctype html><html><head><meta charset="utf-8"></head><body>
<script>
const storageKey='ayo_artikel_session_v1';
let lastResult='';
function send(type, fields) { window.parent.postMessage({isStreamlitMessage:true,type,...fields},'*'); }
window.addEventListener('message',event=>{
  if(event.source!==window.parent || event.data.type!=='streamlit:render') return;
  const args=event.data.args; let token='',available=true;
  try {
    if(args.action==='save') localStorage.setItem(storageKey,args.token);
    if(args.action==='clear') localStorage.removeItem(storageKey);
    token=localStorage.getItem(storageKey)||'';
  } catch(e) { available=false; }
  const result={token,available,nonce:args.nonce};
  const signature=JSON.stringify(result);
  if(signature!==lastResult) {
    lastResult=signature;
    send('streamlit:setComponentValue',{value:result,dataType:'json'});
  }
  send('streamlit:setFrameHeight',{height:0});
});
send('streamlit:componentReady',{apiVersion:1});
send('streamlit:setFrameHeight',{height:0});
</script></body></html>
